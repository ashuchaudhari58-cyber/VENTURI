name: Deploy to GitHub Pages

# Publishes venturi-jet-pump-app/ to GitHub Pages on every push to main that
# touches it. No build step required — the app is plain HTML/CSS/JS (classic
# scripts); index.html lives in that subfolder, not the repo root.

on:
  push:
    branches: [main]
    paths: ['venturi-jet-pump-app/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'venturi-jet-pump-app'   # index.html lives in this subfolder
      - id: deployment
        uses: actions/deploy-pages@v4
