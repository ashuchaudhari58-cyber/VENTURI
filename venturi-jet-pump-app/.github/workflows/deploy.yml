name: Deploy to GitHub Pages

# Publishes the static app to GitHub Pages on every push to main.
# No build step required — the app is plain HTML/CSS/JS (classic scripts).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'          # serve the repository root (index.html at root)
      - id: deployment
        uses: actions/deploy-pages@v4
