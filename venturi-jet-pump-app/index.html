<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Venturi Jet Pump Design Studio</title>
<meta name="description" content="Parametric design and verification of Venturi jet pumps (ejectors) for MTBM slurry circuits — calculation model VENTURI_JET_PUMP_CALCULATOR_v4.">
<meta name="theme-color" content="#080D16">
<link rel="icon" type="image/svg+xml" href="brand/venturi-jet-pump-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/views.css">
<link rel="stylesheet" href="css/report.css">
<script>
  /* apply saved theme / sidebar state before first paint (no flash) */
  try { var p = JSON.parse(localStorage.getItem('vjp_prefs_v1') || '{}'); if (p.theme === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}
</script>
</head>
<body>
  <div class="app" id="app">
    <header class="hdr" id="hdr" role="banner"></header>
    <nav class="side" id="side" aria-label="Workflow navigation"></nav>
    <main class="main" id="main" tabindex="-1"><div id="page"></div></main>
  </div>
  <div id="reportRoot" class="report-root" hidden></div>
  <noscript><div style="padding:24px;font-family:sans-serif">Venturi Jet Pump Design Studio requires JavaScript.</div></noscript>

  <!-- calculation engine (spreadsheet-faithful, independently tested — not modified by the UI) -->
  <script src="js/engine.js"></script>
  <!-- engineering data layer -->
  <script src="js/units.js"></script>
  <script src="js/schema.js"></script>
  <script src="js/formulas.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/geometry.js"></script>
  <script src="js/design.js"></script>
  <script src="js/calcsteps.js"></script>
  <!-- UI & visualization -->
  <script src="js/icons.js"></script>
  <script src="js/ui-kit.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/schematic.js"></script>
  <script src="js/flow.js"></script>
  <script src="js/report.js"></script>
  <!-- state + model-integrity regression (shown in About / Home) -->
  <script src="js/state.js"></script>
  <script src="tests/engine.test.js"></script>
  <!-- pages -->
  <script src="js/pages/home.js"></script>
  <script src="js/pages/inputs.js"></script>
  <script src="js/pages/steps.js"></script>
  <script src="js/pages/results.js"></script>
  <script src="js/pages/schematic.js"></script>
  <script src="js/pages/profiles.js"></script>
  <script src="js/pages/validation.js"></script>
  <script src="js/pages/equations.js"></script>
  <script src="js/pages/compare.js"></script>
  <!-- application shell -->
  <script src="js/app.js"></script>
</body>
</html>
